<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Camera Poses from Photos</title>
<style>
  :root {
    --ink: #16171a;
    --muted: #71737a;
    --faint: #9a9ca3;
    --line: #e3e1dd;
    --paper: #f7f6f3;
    --panel: #fff;
    --accent: #2f5d8a;
    --point: #2f5d8a;
    --camera: #b8512f;
    --warn: #8a6410;
    --warn-bg: #fdf9ee;
    --bad: #a33;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--ink);
    background: var(--paper);
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 20px 28px 18px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
    flex: none;
  }
  h1 { margin: 0 0 5px; font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
  header p { margin: 0; color: var(--muted); font-size: 14px; max-width: 76ch; }
  main {
    flex: 1;
    display: grid;
    grid-template-columns: 372px 1fr;
    min-height: 0;
  }
  aside {
    padding: 20px 24px 32px;
    border-right: 1px solid var(--line);
    background: var(--panel);
    overflow-y: auto;
  }
  section + section { margin-top: 24px; padding-top: 22px; border-top: 1px solid var(--line); }
  h2 {
    margin: 0 0 12px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--faint);
  }

  .drop {
    display: block;
    border: 1.5px dashed var(--line);
    border-radius: 8px;
    padding: 24px 16px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }
  .drop:hover, .drop.over { border-color: var(--accent); background: #f2f6fa; }
  .drop b { display: block; font-weight: 550; margin-bottom: 3px; }
  .drop span { color: var(--muted); font-size: 13px; }
  .drop input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

  .thumbs { display: grid; grid-template-columns: repeat(auto-fill, 52px); gap: 5px; margin-top: 12px; }
  .thumbs canvas { width: 52px; height: 39px; border-radius: 3px; border: 1px solid var(--line); display: block; }

  .field {
    display: block; margin-top: 14px; font-size: 13px; color: var(--muted);
  }
  .field input {
    display: block; width: 100%; margin-top: 5px; padding: 7px 9px;
    font: inherit; font-size: 14px; font-variant-numeric: tabular-nums;
    border: 1px solid var(--line); border-radius: 5px; background: var(--paper);
  }
  .field em { display: block; margin-top: 5px; font-style: normal; font-size: 12.5px; }
  .option {
    display: flex; gap: 8px; align-items: flex-start;
    margin-top: 12px; font-size: 13px; color: var(--muted); cursor: pointer;
  }
  .option input { margin: 2px 0 0; flex: none; }
  .option b { color: var(--ink); font-weight: 500; }
  .actions { margin-top: 14px; display: flex; gap: 8px; align-items: center; }
  button {
    font: inherit;
    font-size: 14px;
    padding: 8px 16px;
    border-radius: 6px;
    border: 1px solid var(--ink);
    background: var(--ink);
    color: #fff;
    cursor: pointer;
  }
  button:disabled { opacity: 0.35; cursor: default; }
  button.ghost { background: none; color: var(--muted); border-color: var(--line); }
  .count { margin-left: auto; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

  .stage { display: flex; justify-content: space-between; font-size: 13.5px; margin-bottom: 7px; }
  .stage span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; }
  .track { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
  .track div { height: 100%; background: var(--accent); width: 0; transition: width 0.2s; }
  .track.busy div { width: 35%; animation: slide 1.1s ease-in-out infinite; }
  @keyframes slide { 0% { margin-left: -35%; } 100% { margin-left: 100%; } }

  .stat { display: flex; justify-content: space-between; padding: 4px 0; font-size: 13.5px; }
  .stat span:first-child { color: var(--muted); }
  .stat span:last-child { font-variant-numeric: tabular-nums; font-weight: 500; }

  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 5px 0; font-size: 13px; border-bottom: 1px solid var(--line); }
  th { color: var(--faint); font-weight: 500; font-size: 10.5px; letter-spacing: 0.05em; text-transform: uppercase; }
  td:not(:first-child), th:not(:first-child) { text-align: right; font-variant-numeric: tabular-nums; }
  td:first-child { max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  tr.anchor td { color: var(--muted); }

  .note {
    margin-top: 12px; padding: 10px 12px;
    border-left: 3px solid var(--warn);
    background: var(--warn-bg); border-radius: 0 4px 4px 0;
    font-size: 13px; color: #5f4a13;
  }
  .note.bad { border-color: var(--bad); background: #fdf2f2; color: #7a2a2a; }
  .skipped { margin-top: 12px; font-size: 12.5px; color: var(--muted); }
  .skipped div { padding: 2.5px 0; }

  figure { margin: 0; position: relative; overflow: hidden; }
  canvas#scene { display: block; width: 100%; height: 100%; cursor: grab; }
  canvas#scene:active { cursor: grabbing; }
  figcaption {
    position: absolute; left: 20px; bottom: 18px;
    font-size: 12.5px; color: var(--faint);
    pointer-events: none;
  }
  .legend {
    position: absolute; right: 20px; top: 18px;
    font-size: 12.5px; color: var(--muted);
    display: flex; gap: 14px;
  }
  .legend b { font-weight: 500; display: flex; align-items: center; gap: 5px; }
  .legend i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
</style>
</head>
<body>
<header>
  <h1>Camera Poses from Photos</h1>
</header>
<main>
  <aside>
    <section>
      <h2>Photos</h2>
      <label class="drop" id="drop">
        <b>Choose photos or drop them here</b>
        <input type="file" id="files" accept="image/*" multiple>
      </label>
      <div class="thumbs" id="thumbs"></div>
      <label class="field">Focal length (pixels)
        <input type="number" id="focal" min="1" step="1">
      </label>
      <label class="option"><input type="checkbox" id="fast">
        <span><b>Fast mode</b></span></label>
      <div class="actions">
        <button id="run" disabled>Reconstruct</button>
        <button id="reset" class="ghost">Clear</button>
        <span class="count" id="count"></span>
      </div>
    </section>

    <section id="progress-section" hidden>
      <h2>Running</h2>
      <div class="stage"><span id="stage">—</span><span id="stage-count"></span></div>
      <div class="track" id="track"><div id="fill"></div></div>
    </section>

    <section id="summary-section" hidden>
      <h2>Result</h2>
      <div id="summary"></div>
      <div id="warning"></div>
    </section>

    <section id="camera-section" hidden>
      <h2>Cameras</h2>
      <table>
        <thead><tr><th>Photo</th><th>Angle ±</th><th>Position ±</th></tr></thead>
        <tbody id="cameras"></tbody>
      </table>
      <div class="skipped" id="skipped"></div>
    </section>
  </aside>

  <figure>
    <canvas id="scene"></canvas>
    <div class="legend" id="legend" hidden>
      <b><i style="background:#2f5d8a"></i>points</b>
      <b><i style="background:#b8512f"></i>cameras</b>
    </div>
    <figcaption id="caption"></figcaption>
  </figure>
</main>
<script type="module" src="./src/app.js"></script>
</body>
</html>
