[project]
name = "sfm"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "opencv-python>=4.10"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sfm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]